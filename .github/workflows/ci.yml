name: CI

# Every push and every PR runs the same gate that a human runs locally. A gate that
# only runs on the developer's machine is a gate that eventually stops running.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The e2e imports the `playwright` package. Install it without touching the
      # lockfile, then fetch the browser it drives.
      - name: Install Playwright and Chromium for the end to end suite
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Review gate
        run: bash scripts/review-gate.sh
        env:
          CHROMIUM_PATH: ''

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            dist/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Deploy to Pages
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      # Pages accepts one deployment at a time; queue instead of cancelling, so a
      # rapid pair of pushes both land in order rather than the newer one being
      # killed mid-flight by the older.
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact is a SINGLETON per run: it publishes under the fixed
      # name "github-pages", and deploy-pages refuses to run when it finds more than
      # one. That is exactly what happened twice on 2026-11-23: a failed deploy was
      # re-run, the retry uploaded a second artifact into the same run, and the next
      # deploy failed with "Multiple artifacts named github-pages were unexpectedly
      # found". It is unrecoverable by re-running, so the recovery is to never be in
      # that state: delete the leftovers before publishing, which makes the job safe
      # to re-run any number of times.
      - name: Clear leftover Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id, per_page: 100,
            });
            const stale = data.artifacts.filter((a) => a.name === 'github-pages');
            if (stale.length === 0) {
              core.info('No leftover github-pages artifacts.');
              return;
            }
            for (const art of stale) {
              core.info(`Deleting leftover artifact ${art.id} (${art.name}).`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
            }
            core.info(`Deleted ${stale.length} leftover artifact(s); the deploy can proceed.`);

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
